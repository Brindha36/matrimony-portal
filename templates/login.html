<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Matrimony OS</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #d31027 0%, #ea384d 50%, #f09819 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(14px);
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.22);
            width: 100%;
            max-width: 420px;
        }
        .btn-gradient {
            background: linear-gradient(135deg, #d31027 0%, #f09819 100%);
            color: #fff;
            font-weight: 700;
            border: none;
            border-radius: 10px;
            padding: 12px;
            transition: all 0.22s ease;
        }
        .btn-gradient:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(211, 16, 39, 0.35);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="card login-card border-0 p-4 p-md-5 m-3">
        <div class="text-center mb-4">
            <span class="bg-danger text-white rounded-circle p-3 d-inline-flex align-items-center justify-content-center mb-3 shadow">
                <i class="bi bi-heart-pulse-fill fs-3"></i>
            </span>
            <h3 class="fw-extrabold text-dark mb-1">Matrimony<span class="text-danger">OS</span></h3>
            <p class="text-muted small">Sign in to manage AI extractions &amp; candidate data</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, msg in messages %}
                    <div class="alert alert-{{ category }} p-2 small mb-3 border-0 text-center">{{ msg }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label small fw-bold text-dark">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-danger"></i></span>
                    <input type="text" name="username" class="form-control border-start-0" placeholder="admin" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label small fw-bold text-dark">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-danger"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="••••••••" required>
                </div>
            </div>
            <button type="submit" class="btn btn-gradient w-100 mb-2">Sign In to Dashboard</button>
        </form>
    </div>
</body>
</html>
